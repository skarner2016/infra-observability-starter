global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # 容器指标由 Alloy 内嵌 cAdvisor 采集,经 remote_write 写入本实例
  - job_name: demo-web
    static_configs:
      - targets: ["demo-web:8080"]

  - job_name: nginx-exporter
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: caddy
    static_configs:
      - targets: ["caddy:2019"]

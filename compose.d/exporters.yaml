services:
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.8.2}
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:${ALLOY_SYSLOG_PORT:-1514}"
        syslog-format: "rfc5424"
        syslog-facility: "daemon"
        tag: "node-exporter"
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    depends_on:
      alloy:
        condition: service_healthy
    networks:
      - infra_net

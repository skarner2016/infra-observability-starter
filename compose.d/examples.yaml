services:
  demo-web:
    build: ../examples/demo-web
    image: infra-observability-starter/demo-web:latest
    profiles:
      - examples
      - caddy
    restart: unless-stopped
    ports:
      - "${DEMO_WEB_PORT:-8080}:8080"
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
    networks:
      - examples_net

  nginx:
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    profiles:
      - examples
    restart: unless-stopped
    volumes:
      - ../examples/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../examples/nginx/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "${PROXY_PORT:-8088}:80"
    networks:
      - examples_net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:${NGINX_EXPORTER_VERSION:-1.3.0}
    profiles:
      - examples
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx/stub_status
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9113"
    networks:
      - examples_net

  caddy:
    image: caddy:${CADDY_VERSION:-2.8-alpine}
    profiles:
      - caddy
    restart: unless-stopped
    volumes:
      - ../examples/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../examples/caddy/index.html:/usr/share/caddy/index.html:ro
    ports:
      - "${PROXY_PORT:-8088}:80"
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "2019"
    networks:
      - examples_net

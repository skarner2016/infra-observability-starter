services:
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.2.1}
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:${ALLOY_SYSLOG_PORT:-1514}"
        syslog-format: "rfc5424"
        syslog-facility: "daemon"
        tag: "loki"
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ../config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ../data/loki:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    depends_on:
      alloy:
        condition: service_healthy
    networks:
      - infra_net

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.4.2}
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ../config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../data/alloy:/var/lib/alloy/data
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}:/var/lib/docker:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "${ALLOY_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${ALLOY_SYSLOG_PORT:-1514}:1514"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345; printf 'GET /-/healthy HTTP/1.0\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - infra_net

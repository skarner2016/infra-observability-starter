services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.54.1}
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:${ALLOY_SYSLOG_PORT:-1514}"
        syslog-format: "rfc5424"
        syslog-facility: "daemon"
        tag: "prometheus"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../data/prometheus:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      alloy:
        condition: service_healthy
    networks:
      - infra_net
      - examples_net

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.2.0}
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:${ALLOY_SYSLOG_PORT:-1514}"
        syslog-format: "rfc5424"
        syslog-facility: "daemon"
        tag: "grafana"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../data/grafana:/var/lib/grafana
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      alloy:
        condition: service_healthy
    networks:
      - infra_net
